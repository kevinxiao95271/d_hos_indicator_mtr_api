server:
  port: 8075

spring:
  application:
    name: indicator-mtr

  # HTTP 编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 主数据源 - 腾讯云 MySQL
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://gz-cdb-bq7gk3k5.sql.tencentcdb.com:63606/d_hos_indicator_mtr_20260720?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      username: root
      password: Yiguo9527_

      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      # 监控统计配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

      # Web监控配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

      # 日志配置
      filter:
        slf4j:
          enabled: true
          statement-executable-sql-log-enable: true

# MyBatis Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.hospital.indicator.entity
  # 配置
  configuration:
    # 是否开启自动驼峰命名规则映射
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  # 全局配置
  global-config:
    db-config:
      # 主键类型（AUTO 自增）
      id-type: AUTO
      # 表名前缀
      table-prefix: t_
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.hospital.indicator: DEBUG
    com.hospital.indicator.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# Springdoc OpenAPI 配置（Swagger 3）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hospital.indicator.controller

# JWT 配置
jwt:
  # 密钥
  secret: hospital_indicator_mtr_system_secret_key_2026
  # 过期时间（秒），默认 1 天 (86400秒)
  expire: 86400
  # 请求头名称
  header: Authorization
  # 令牌前缀
  prefix: "Bearer "

# 大查询自动分片拆解配置
indicator:
  shard:
    slice:
      timeout-seconds: 30        # 单片 SQL 超时(秒),超时即失败重试/中止

